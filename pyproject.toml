[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort (import sorting)
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG",    # unused arguments
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # function call in default argument
  "ARG001", # unused first argument (for methods)
  "ARG002", # unused positional argument
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # allow star imports and unused imports in __init__
"tests/*" = ["ARG001", "ARG002"]  # allow unused args in test fixtures

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
